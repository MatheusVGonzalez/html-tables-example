    <meta charset="UTF-8">

    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <table>
        <caption>Product Comparison Chart         <br>
            <br></caption>

        <thead>
            
            <tr>
                <th scope="col" id="Product"></th>
                <th scope="col" id="ProductA">Product A</th>
                <th scope="col" id="ProductB">Product B</th>
                <th scope="col" id="ProductC">Product C</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td id="durability">Durability</td>
                <td headers="durability A" id="durabilityA">10/10</td>
                <td headers="durability B" id="durabilityB">5/10</td>
                <td headers="durability C" id="durabilityC">7/10</td>
            </tr>
            <tr>
                <td id="design">Design</td>
                <td headers="design A" id="designA">3/10</td>
                <td headers="design B" id="designB">8/10</td>
                <td headers="design C" id="designC">7/10</td>
            </tr>
            <tr>
                <td id="usability">Usability</td>
                <td headers="usability A" id="usabilityA">7/10</td>
                <td headers="usability B" id="usabilityA">10/10</td>
                <td headers="usability C" id="usabilityA">5/10</td>
            </tr>
            <tr>
                <td id="price">Price</td>
                <td headers="price A" id="priceA">9/10</td>
                <td headers="price B" id="priceB">7/10</td>
                <td headers="price C" id="priceC">3/10</td>
            </tr>
        </tbody>
    </table>
    
    <figcaption><br>Fig: Comparison of the features between the products.</figcaption>
